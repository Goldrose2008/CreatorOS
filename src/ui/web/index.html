<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreatorOS</title>

    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/shell.css">
</head>

<body>
    <div id="app">
        <div class="app-shell">
            <aside class="sidebar">
                <div class="sidebar__brand">
                    <div id="app-brand-mark"></div>
                    <div id="app-brand-name"></div>
                </div>

                <nav id="main-navigation" class="sidebar__nav">
                    <div id="menu.section.01"></div>
                    <div id="menu.item.01"></div>
                    <div id="menu.item.02"></div>
                    <div id="menu.item.03"></div>
                    <div id="menu.item.04"></div>
                    <div id="menu.item.05"></div>
                    <div id="menu.item.06"></div>

                    <div id="menu.section.02"></div>
                    <div id="menu.item.07"></div>
                </nav>

                <div class="sidebar__footer">
                    <div class="connection">
                        <span id="connection-dot" class="connection__dot"></span>
                        <span id="connection-status"></span>
                    </div>
                    <div id="app-version" class="sidebar__version"></div>
                </div>
            </aside>

            <section class="main-area">
                <header class="topbar">
                    <h1 id="page-home-title" class="topbar__title" data-text-id="home"></h1>
                    <span id="page-home-context" class="topbar__context" data-text-id="workspace.lowercase"></span>
                </header>

                <main class="workspace">
                    <section class="workspace__intro">
                        <p class="workspace__eyebrow" data-text-id="welcome"></p>
                        <h2 class="workspace__heading" data-text-id="your_workspace"></h2>
                        <p class="workspace__description" data-text-id="home.description"></p>
                    </section>

                    <section class="dashboard-grid">
                        <article class="dashboard-card">
                            <p class="dashboard-card__label" data-text-id="projects"></p>
                            <div class="dashboard-card__value">
                                0
                            </div>
                            <p class="dashboard-card__hint" data-text-id="projects.empty"></p>
                        </article>

                        <article class="dashboard-card">
                            <p class="dashboard-card__label" data-text-id="tasks"></p>
                            <div class="dashboard-card__value">
                                0
                            </div>
                            <p class="dashboard-card__hint" data-text-id="tasks.active"></p>
                        </article>
                    </section>
                </main>
            </section>
        </div>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script type="module" src="./js/app.js"></script>

</body>
</html>
