<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreatorOS</title>

    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/shell.css">
</head>

<body>
    <div id="app">
        <div class="app-shell">
            <aside class="sidebar">
                <div class="sidebar__brand">
                    <div data-ui-id="app.brand.mark"></div>
                    <div data-ui-id="app.brand.name"></div>
                </div>

                <nav id="main-navigation" class="sidebar__nav" data-ui-id="menu.navigation.label">
                    <div data-ui-id="menu.section.01"></div>
                    <div data-ui-id="menu.item.01"></div>
                    <div data-ui-id="menu.item.02"></div>
                    <div data-ui-id="menu.item.03"></div>
                    <div data-ui-id="menu.item.04"></div>
                    <div data-ui-id="menu.item.05"></div>
                    <div data-ui-id="menu.item.06"></div>

                    <div data-ui-id="menu.section.02"></div>
                    <div data-ui-id="menu.item.07"></div>
                </nav>

                <div class="sidebar__footer">
                    <div class="connection">
                        <span id="connection-dot" class="connection__dot"></span>
                        <span data-ui-id="bridge.connecting"></span>
                    </div>
                    <div data-ui-id="app.version" class="sidebar__version"></div>
                </div>
            </aside>

            <section class="main-area">
                <header class="topbar">
                    <h1 class="topbar__title" data-ui-id="page.home.title"></h1>
                    <span class="topbar__context" data-ui-id="page.home.context"></span>
                </header>

                <main class="workspace">
                    <section class="workspace__intro">
                        <p class="workspace__eyebrow" data-ui-id="page.home.eyebrow"></p>
                        <h2 class="workspace__heading" data-ui-id="page.home.heading"></h2>
                        <p class="workspace__description" data-ui-id="page.home.description"></p>
                    </section>

                    <section class="dashboard-grid">
                        <article class="dashboard-card">
                            <p class="dashboard-card__label" data-ui-id="dashboard.projects.label"></p>
                            <div class="dashboard-card__value">
                                0
                            </div>
                            <p class="dashboard-card__hint" data-ui-id="dashboard.projects.hint"></p>
                        </article>

                        <article class="dashboard-card">
                            <p class="dashboard-card__label" data-ui-id="dashboard.tasks.label"></p>
                            <div class="dashboard-card__value">
                                0
                            </div>
                            <p class="dashboard-card__hint" data-ui-id="dashboard.tasks.hint"></p>
                        </article>

                        <article class="dashboard-card">
                            <p class="dashboard-card__label" data-ui-id="dashboard.publications.label"></p>
                            <div class="dashboard-card__value">
                                0
                            </div>
                            <p class="dashboard-card__hint" data-ui-id="dashboard.publications.hint"></p>
                        </article>
                    </section>
                </main>
            </section>
        </div>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script type="module" src="./js/app.js"></script>

</body>
</html>
